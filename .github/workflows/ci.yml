name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: コードを取得
        uses: actions/checkout@v6

      - name: 必要なライブラリをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libvips

      - name: Rubyとgemを準備
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: テスト用DBを準備
        run: bin/rails db:prepare

      - name: RSpecを実行
        run: bundle exec rspec

      - name: RuboCopを実行
        run: bundle exec rubocop